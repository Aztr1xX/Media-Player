name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish the installer as a GitHub release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt 6.8 LTS + MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_mingw
          tools: 'tools_mingw1310'
          cache: true

      - name: Put MinGW on PATH
        shell: pwsh
        run: |
          $mingw = Get-ChildItem "$env:IQTA_TOOLS" -Directory -Filter "mingw*" | Select-Object -First 1
          "$($mingw.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "MinGW: $($mingw.FullName)"

      - name: Download libmpv (LGPL dev build) and FFmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory deps | Out-Null
          gh release download --repo zhongfly/mpv-winbuild --pattern "mpv-dev-lgpl-x86_64-2*.7z" --dir deps
          7z x (Get-ChildItem deps\*.7z | Select-Object -First 1).FullName -odeps\mpv | Out-Null
          gh release download latest --repo BtbN/FFmpeg-Builds --pattern "ffmpeg-master-latest-win64-gpl.zip" --dir deps
          7z x deps\ffmpeg-master-latest-win64-gpl.zip -odeps | Out-Null
          gh release view --repo ggml-org/whisper.cpp --json tagName,assets --jq '.tagName, (.assets[].name)'
          gh release download --repo ggml-org/whisper.cpp --pattern "whisper-bin-x64.zip" --dir deps
          if (Test-Path deps\whisper-bin-x64.zip) { 7z x deps\whisper-bin-x64.zip -odeps\whisper | Out-Null }
          gh release download --repo yt-dlp/yt-dlp --pattern "yt-dlp.exe" --dir deps
          Get-ChildItem -Recurse deps\whisper | ForEach-Object { $_.FullName }

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DMPV_DIR="$PWD/deps/mpv"
          cmake --build build --parallel

      - name: Unit tests
        shell: pwsh
        run: .\build\slate_tests.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build\slate.exe dist\Slate.exe
          windeployqt --release --qmldir qml --no-translations dist\Slate.exe
          Copy-Item (Get-ChildItem -Recurse deps\mpv -Filter "libmpv-2.dll" | Select-Object -First 1).FullName dist\
          $ff = Get-ChildItem -Recurse deps -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ff.FullName dist\
          Copy-Item (Join-Path $ff.DirectoryName "ffprobe.exe") dist\
          $wc = Get-ChildItem -Recurse deps\whisper -Filter "whisper-cli.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wc) {
            Copy-Item $wc.FullName dist\
            Get-ChildItem $wc.DirectoryName -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName dist\ -Force }
          } else {
            Write-Host "::warning::whisper-cli.exe not found; transcription won't be bundled"
          }
          Copy-Item deps\yt-dlp.exe dist\
          Copy-Item README.md dist\
          Get-ChildItem dist -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Self-test on the packaged app (software OpenGL on the runner)
        shell: pwsh
        run: |
          # two clips in their own folder, so "next file in folder" has somewhere to go
          New-Item -ItemType Directory selftest-media | Out-Null
          foreach ($n in 1, 2) {
            .\dist\ffmpeg.exe -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=30" -f lavfi -i "sine=frequency=440:duration=30" -c:v libx264 -g 60 -pix_fmt yuv420p -c:a aac -shortest "selftest-media\clip $n.mp4"
          }
          $env:QT_OPENGL = "software"
          $p = Start-Process -FilePath dist\Slate.exe -ArgumentList '--selftest','"selftest-media\clip 1.mp4"','--screenshot','selftest.png' -Wait -PassThru
          if (Test-Path selftest.png.log) { Get-Content selftest.png.log }
          exit $p.ExitCode

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          }
          & $iscc /DAppVersion=1.0.0 /DSourceDir="$PWD\dist" /DOutputDir="$PWD\installer" packaging\windows\slate.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\* -DestinationPath installer\Slate-portable.zip
          Get-ChildItem installer

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Slate-installer
          path: installer
          if-no-files-found: ignore

      - name: Publish release (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          $notes = "Latest build of Slate from commit ${{ github.sha }}. Download Slate-Setup-1.0.0.exe and run it. SmartScreen may warn because the app isn't signed: choose More info, then Run anyway."
          gh release create latest installer\Slate-Setup-1.0.0.exe installer\Slate-portable.zip --title "Slate (latest build)" --notes "$notes" --target ${{ github.sha }} --latest

      - name: Upload self-test screenshot
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: selftest-results
          path: |
            selftest.png
            selftest.png.log
          if-no-files-found: ignore
